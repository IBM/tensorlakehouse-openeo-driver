kind: Deployment
apiVersion: apps/v1
metadata:
  name: tensorlakehouse-openeo-driver
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.tensorlakehouse.replicasWebserver }}
  selector:
    matchLabels:
      app: tensorlakehouse-openeo-driver
  template:
    metadata:
      labels:
        app: tensorlakehouse-openeo-driver
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      containers:
        - name: tensorlakehouse-openeo-driver
          image: {{ .Values.tensorlakehouse.image }}
          ports:
            - containerPort: 9091
              protocol: TCP
          env:
            - name: STAC_URL
              value: >-
                {{ .Values.stacurl }}
            - name: OPENEO_GEODN_DRIVER_PORT
              value: '9091'
            - name: DASK_SCHEDULER_ADDRESS
              value: 'dask-scheduler:8786'
            - name: KUBEFLOW_PIPELINE_API 
              value: >-
                {{ .Values.kubeflowpipelines.host }}
            - name: SENTINEL_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: SENTINEL_DB_HOST
            - name: SENTINEL_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: SENTINEL_DB_PORT
            - name: SENTINEL_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: SENTINEL_DB_NAME
            - name: SENTINEL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: SENTINEL_DB_USER
            - name: SENTINEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: SENTINEL_DB_PASSWORD
            - name: BROKER_URL
              value: {{ .Values.redis }}
            - name: RESULT_BACKEND
              value: {{ .Values.redis }}
            - name: APPID_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: APPID_ISSUER
            - name: OPENEO_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: OPENEO_AUTH_CLIENT_SECRET
            - name: OPENEO_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tensorlakehouse.secretName }}
                  key: OPENEO_AUTH_CLIENT_ID
            - name: HLS_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: tensorlakehouse-configmap
                  key: HLS_INSTANCE
            - name: HLS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: tensorlakehouse-configmap
                  key: HLS_ENDPOINT
            - name: OPENEOTEST_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: tensorlakehouse-configmap
                  key: OPENEOTEST_INSTANCE
            - name: OPENEOTEST_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: tensorlakehouse-configmap
                  key: OPENEOTEST_ENDPOINT
            - name: OPENEOGEODNDRIVEROUTPUT_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: tensorlakehouse-configmap
                  key: OPENEOGEODNDRIVEROUTPUT_INSTANCE
            - name: OPENEOGEODNDRIVEROUTPUT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: tensorlakehouse-configmap
                  key: OPENEOGEODNDRIVEROUTPUT_ENDPOINT
          resources:
            limits:
              cpu: {{ quote .Values.tensorlakehouse.cpu }}
              memory: {{ .Values.tensorlakehouse.memory }}
            requests:
              cpu: {{ quote .Values.tensorlakehouse.cpu }}
              memory: {{ .Values.tensorlakehouse.memory }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      securityContext: {}
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
